<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0.25)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07090e"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="#0d111a" fill-opacity="0.85" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Brand Monogram Header -->
  <g transform="translate(90, 90)">
    <rect width="52" height="52" rx="12" fill="#141a26" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="26" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#3b82f6" text-anchor="middle">AC</text>
    <text x="70" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">Arif Coskun</text>
    <rect x="230" y="16" width="220" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="245" cy="29" r="4" fill="#10b981"/>
    <text x="258" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">Systems &amp; AI Architect</text>
  </g>

  <!-- Main Statement -->
  <g transform="translate(90, 210)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#f1f5f9" letter-spacing="-1">
      Architecting High-Truth Enterprise Platforms
    </text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#3b82f6" letter-spacing="-1">
      &amp; Autonomous AI Systems.
    </text>
    
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Senior Technical Architect @ beqom (13+ yrs) · Co-Founder of MindBall · Sovereign AI Builder
    </text>
  </g>

  <!-- Pillar Badges -->
  <g transform="translate(90, 420)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="85" rx="10" fill="#141a26" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3b82f6" letter-spacing="1">20+ YEARS RIGOR</text>
      <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">Microsoft Fabric &amp; Cloud</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(350, 0)">
      <rect width="320" height="85" rx="10" fill="#141a26" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="1">MOBILE &amp; SECURITY</text>
      <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">MindBall Co-Founder</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(700, 0)">
      <rect width="320" height="85" rx="10" fill="#141a26" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1">AUTONOMOUS AI</text>
      <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">Agentic Software Factories</text>
    </g>
  </g>

  <!-- Location / URL Footer -->
  <g transform="translate(90, 550)">
    <text x="0" y="0" font-family="monospace" font-size="14" fill="#64748b">https://arifcoskun.com · Seattle, WA &amp; Istanbul, TR · Bilingual EN / TR</text>
  </g>
</svg>
